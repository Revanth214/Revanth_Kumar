<!DOCTYPE html>
<html>
    <head>
        <title>Register Page</title>
        <link rel="stylesheet" href="style2.css">
    </head>
    <body>
        <div class="Registration">
        <table>
            <tr><th colspan="2" id="table_heading">Registration for Mouser Electronics Training</th></tr>
            <tr><th colspan="2" >August 25, 2026 - 9 AM to 10 Am</th></tr>
            <tr><th colspan="2" id="table_heading">Registrant Information</th></tr>
            <tr><td><label for="">Company :</label></td><td><input type="text" name="" id="" placeholder="Enter Company Name"></td></tr>
            <tr><td>First Name : *</td><td><input type="text" name="" id="" placeholder="Enter First Name"></td></tr>
            <tr><td>Last Name : *</td><td><input type="text" name="" id="" placeholder="Enter Last Name"></td></tr>
            <tr><td>Email :</td><td><input type="email" name="" id="" placeholder="Enter Email"></td></tr>
            <tr><td>Phone :</td><td><input type="tel" name="" id="" placeholder="Enter Phone Number"></td></tr>
            <tr><td>Address* </td><td><input type="text" placeholder="Enter Your Address"></td></tr>
            <tr><td>City*</td>
                <td> 
                <select>
                    <option>Bengaluru</option>
                    <option value="">Amaravati</option>
                    <option value="">Hyderabad</option>
                    <option value="">Mumbai</option>
                </select></td>
            </tr>
            <tr><td>State*</td>            <td>
                <select>
                    <option>Andhra Pradesh</option>
                    <option>Karnataka</option>
                    <option>Kerala</option>
                    <option value="">Maharashtra</option>
                </select>
            </td></td></tr>
            <tr><td colspan="2" class="button_cell"><input type="button" value="Submit My Registration" id="my_button"></td></tr>
        </table>
        </div>
    </body>

</html>
